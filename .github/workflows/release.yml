name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Create Release Notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          # Love ${VERSION}

          Стабильное обновление 5.2.0: Глобальная трансляция экрана в комнатах, Theater Mode, исправления закрепленных сообщений и обновленный минималистичный интерфейс.

          ## Что нового

          ### Трансляция Экрана и Комнаты (Rooms)
          - Добавлена полноценная поддержка трансляции экрана в голосовых Комнатах (внутри сетки участников).
          - **Theater Mode (Режим Кинотеатра):** Добавлена кнопка «На весь экран», которая плавно выводит трансляцию поверх чата с кинематографичным затемнением заднего фона. Клик по пустому пространству легко сворачивает трансляцию.
          - Добавлена адаптивная сетка трансляции с поддержкой aspect-ratio (16:9) и корректным масштабированием оконном режиме.

          ### Сообщения и Навигация
          - **Закрепленные сообщения:** Исправлен баг, из-за которого сервер не транслировал закрепление сообщений в личных сообщениях.
          - Исправлен рассинхрон состояния: список закрепленных сообщений в окне теперь всегда отображает актуальные данные сервера.
          - **Улучшенный Поиск:** При переходе к найденному сообщению добавлена мягкая анимация фоновой подсветки (белое свечение), которая плавно затухает, улучшая визуальный поиск нужного текста.

          ### UI и Design System
          - **Минимализм:** Яркие (зеленые и синие) цвета активных голосовых кнопок заменены на элегантный monochrome glassmorphism (прозрачный белый).
          - Исправлены ошибки \`ERR_CONNECTION_CLOSED\` с нерабочими аватарками заглушками. Внедрен локальный надежный генератор fallback-аватарок во всех разделах (поиск, профиль, пины).

          ## Стабильность

          - Исправлена CSP-политика для Cloudinary audio/video.
          - Исправлены edge cases с WebM metadata.
          - Исправлены realtime state edge cases для voice/calls/chat.

          **Version:** \`${VERSION}\`
          EOF

      - name: Publish Release Description
        uses: softprops/action-gh-release@v2
        with:
          name: Love ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

      - name: Build and Publish
        run: npm run build:server && npx electron-builder build --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
