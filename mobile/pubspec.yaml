name: love_mobile
description: Flutter mobile client for Love.
publish_to: "none"
version: 2.0.5+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  http_parser: ^4.0.0
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  socket_io_client: ^3.1.6
  app_links: ^7.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.2
  flutter_svg: ^2.3.0
  just_audio: ^0.10.6
  record: ^6.1.1
  flutter_webrtc: ^1.5.2
  flutter_local_notifications: ^18.0.1
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icons/more.svg
    - assets/icons/auth_mark.svg
    - assets/sounds/test_tone.wav
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
        - asset: assets/fonts/Lora-Italic-Variable.ttf
          style: italic
    - family: FiraMono
      fonts:
        - asset: assets/fonts/FiraMono-Regular.ttf
        - asset: assets/fonts/FiraMono-Medium.ttf
          weight: 500
