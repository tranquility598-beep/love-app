name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Create Release Notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          # Love v${VERSION} ✨

          Мы рады представить вам стабильное обновление **Love 5.2.0**! В этой версии мы сосредоточились на улучшении функционала голосовых комнат, визуальном минимализме и устранении раздражающих багов. 

          ## 🚀 Что нового

          ### 📺 Трансляция экрана в Комнатах (Rooms)
          - **Глобальный показ:** Теперь вы можете транслировать свой экран не только в личных звонках, но и прямо в текстовых/голосовых Комнатах! Трансляции аккуратно встраиваются в общую сетку участников.
          - **Режим Кинотеатра (Theater Mode):** Добавлена новая кнопка расширения видео. При нажатии трансляция плавно вылетает поверх чата (90% от экрана) с красивым кинематографичным затемнением заднего фона. Клик в любую темную область — и видео так же плавно возвращается на место.
          - **Адаптивность:** Улучшена сетка трансляций. Теперь карточки корректно соблюдают пропорции (16:9) и не ломают интерфейс при изменении размеров окна приложения.

          ### 💬 Сообщения и Навигация
          - **Анимация Поиска:** Искать сообщения стало приятнее! При клике на результат поиска приложение плавно подсвечивает найденное сообщение мягким белым "стеклянным" свечением, которое аккуратно затухает (вместо резкого темного мигания).
          - **Закрепленные сообщения:** Глобальный фикс багов с "пинами". Теперь закрепление сообщений в личных переписках (DM) работает так же надежно, как и на серверах. Все участники диалога мгновенно видят обновления.
          - **Синхронизация:** Устранен баг, из-за которого панель закрепленных сообщений иногда показывала устаревшие данные.

          ### 🎨 UI и Дизайн (Glassmorphism)
          - **Минимализм:** Мы отказались от резких зеленых и синих кнопок активации микрофона/звука. Теперь активные элементы используют элегантный стиль прозрачного белого стекла (monochrome glassmorphism), который идеально вписывается в общую темную эстетику приложения. (Красные кнопки отключения сохранены для безопасности).
          - **Аватарки:** Починили надоедливую ошибку \`ERR_CONNECTION_CLOSED\`. Если у пользователя нет аватарки, больше никаких "битых" картинок в поиске или профиле — везде корректно генерируется красивая заглушка.
          - **Полноэкранный режим (F11):** Исправлен баг "ловушки", из-за которого при переходе в режим F11 кнопка "Свернуть в окно" переставала работать.

          ---
          *Спасибо, что остаётесь с нами и помогаете делать Love лучше! ❤️*
          EOF

      - name: Publish Release Description
        uses: softprops/action-gh-release@v2
        with:
          name: Love ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

      - name: Build and Publish
        run: npm run build:server && npx electron-builder build --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
