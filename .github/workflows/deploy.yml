name: Deploy backend to production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "admin/**"
      - "client/**"
      - "sandbox/public/**"
      - "ops/production/**"
      - "package.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: love-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Use the production Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            admin/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix server --ignore-scripts

      - name: Reject high severity dependency issues
        run: npm audit --prefix server --omit=dev --audit-level=high

      - name: Run backend tests
        run: npm test --prefix server

      - name: Install admin dependencies
        run: npm ci --prefix admin --ignore-scripts

      - name: Verify and build admin panel
        run: |
          npm test --prefix admin
          npm run lint --prefix admin
          npm run build --prefix admin

      - name: Build immutable release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '{"gitSha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > release-manifest.json
          tar \
            --exclude='server/.env' \
            --exclude='server/node_modules' \
            --exclude='server/uploads' \
            --exclude='server/private-uploads' \
            --exclude='server/temp' \
            -czf love-release.tgz \
            release-manifest.json package.json server client sandbox/public ops/production admin/dist
          sha256sum love-release.tgz > love-release.tgz.sha256

      - name: Configure strict SSH host verification
        id: ssh
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -Eeuo pipefail
          missing=""
          for name in SSH_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USERNAME; do
            value="${!name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Автодеплой выключен::Не заданы секреты окружения production:$missing. Код проверен и архив собран, но на сервер не отправлен — деплой нужно сделать вручную."
            {
              printf '### Автодеплой выключен\n\n'
              printf 'В окружении `production` не заданы секреты:%s\n\n' "$missing"
              printf 'Проверки прошли, архив собран, но на сервер он не уехал.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload verified candidate
        if: steps.ssh.outputs.ready == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -Eeuo pipefail
          scp -P 22 love-release.tgz love-release.tgz.sha256 \
            "$SSH_USERNAME@$SSH_HOST:/var/www/love-staging/"

      - name: Backup, smoke test, migrate and switch
        if: steps.ssh.outputs.ready == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -Eeuo pipefail
          ssh -p 22 "$SSH_USERNAME@$SSH_HOST" \
            'sudo -n /usr/local/sbin/love-deploy-release'
