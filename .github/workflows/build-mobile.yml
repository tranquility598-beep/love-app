name: Build Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release --dart-define=LOVE_API_BASE_URL=https://api.loveapp.chat

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: love-mobile-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mobile/build/app/outputs/flutter-apk/app-release.apk
          asset_name: love-mobile-v${{ github.ref_name }}.apk
          tag: ${{ github.ref_name }}
          overwrite: true
