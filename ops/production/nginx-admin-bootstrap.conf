server {
    listen 80;
    listen [::]:80;
    server_name admin.loveapp.chat;

    include /etc/nginx/snippets/love-cloudflare-allow.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
