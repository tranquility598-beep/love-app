server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.loveapp.chat;

    ssl_certificate /etc/letsencrypt/live/api.loveapp.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.loveapp.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Administrative traffic is available only through admin.loveapp.chat.
    # Case-insensitive matching is intentional: Express route matching is
    # case-insensitive, so /API/ADMIN must be closed exactly like /api/admin.
    location ~* ^/api/admin(?:/|$) {
        return 404;
    }

    location ~* ^/admin(?:/(.*))?$ {
        return 308 https://admin.loveapp.chat/$1$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.loveapp.chat;
    return 301 https://api.loveapp.chat$request_uri;
}
