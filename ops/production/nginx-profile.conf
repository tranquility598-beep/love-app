# Public profiles use a separate origin from the authenticated application.
server {
    listen 80;
    listen [::]:80;
    server_name me.loveapp.chat;
    return 301 https://me.loveapp.chat$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name me.loveapp.chat;

    ssl_certificate /etc/letsencrypt/live/me.loveapp.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/me.loveapp.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
